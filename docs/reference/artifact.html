<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Super Simple Budget</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one focused question per screen (centre) with a slim progress bar above and a live running tally beside it; tally docks to the bottom on phones */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --ink:#132a30; --muted:#5a6f75; --line:#d8e2e4;
  --accent:#0d6b73; --accent-soft:#dcefef; --good:#1d7a46; --good-soft:#e2f3e8;
  --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --b-home:#1f6f8b; --b-around:#4f9b5d; --b-everyday:#d29a2e; --b-family:#8b5fbf; --b-debt:#c2563a; --b-save:#1d7a46;
  --good-mid:#8fd1a8;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1a1d;--surface:#15252a;--ink:#e4eef0;--muted:#97abb0;--line:#28403f;
  --accent:#4fc0c4;--accent-soft:#16383b;--good:#5ccf8a;--good-soft:#173528;--warn:#f0b35a;--warn-soft:#3a2c14;--bad:#ff8a80;--bad-soft:#3f1d1b;--good-mid:#a9e4c3;
  --b-home:#3a8fb0;--b-save:#3fae6a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a1d;--surface:#15252a;--ink:#e4eef0;--muted:#97abb0;--line:#28403f;
  --accent:#4fc0c4;--accent-soft:#16383b;--good:#5ccf8a;--good-soft:#173528;--warn:#f0b35a;--warn-soft:#3a2c14;--bad:#ff8a80;--bad-soft:#3f1d1b;--good-mid:#a9e4c3;
  --b-home:#3a8fb0;--b-save:#3fae6a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;flex:none;display:block}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.3rem}
.sub{color:var(--muted);font-size:.85rem}
.headr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.langbtn{border:1px solid var(--line)}
.example{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ex{background:var(--warn-soft);color:var(--warn)}
.pill.saved{background:var(--good-soft);color:var(--good)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:9px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* progress */
.progress{display:flex;gap:6px;margin:6px 0 26px}
.progress button{flex:1 1 0;min-width:0;border:0;background:none;padding:0;text-align:left;font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress i{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:6px}
.progress .done i{background:var(--accent);opacity:.55}
.progress [aria-current="step"]{color:var(--ink);font-weight:700}
.progress [aria-current="step"] i{background:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
main{min-width:0}
.eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
h2{font-size:2rem;font-weight:700;margin:6px 0 8px}
.lede{color:var(--muted);max-width:60ch;margin:0 0 22px}
/* picked rows */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 18px 14px;margin-bottom:16px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0 6px;flex-wrap:wrap}
.panel-h h3{font-size:1rem}
.panel-h .tot{font-family:var(--mono);font-size:.95rem}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0 4px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 124px 148px 40px 40px;gap:8px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.row .lab{min-width:0;font-size:.95rem}
.row .lab small{display:block;color:var(--muted);font-size:.78rem;line-height:1.35;margin-top:2px}
.tipline{grid-column:1/-1;display:flex;gap:8px;align-items:flex-start;font-size:.84rem;background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.icon{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--muted)}
.icon:hover{border-color:var(--line);color:var(--accent)}
.icon[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.money{position:relative}
.money::before{content:"$";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--mono)}
.money input,.txt{width:100%;padding:9px 8px 9px 22px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--mono);font-size:.95rem;text-align:right;color:var(--ink)}
.txt{font-family:var(--body);text-align:left;padding-left:10px}
html[lang^="fr"] .money::before{left:auto;right:10px}
html[lang^="fr"] .money input{padding-left:8px;padding-right:24px}
.money input:focus,.txt:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
select{width:100%;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.88rem}
/* chips */
.pick h3{font-size:1rem;margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px 8px 11px;font-size:.92rem;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip b{color:var(--accent);font-weight:700}
.chip.more{border-style:dashed;color:var(--accent);font-weight:700}
.search{margin:14px 0 4px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.results-list .where{font-size:.75rem;color:var(--muted)}
.estimate{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:.92rem;cursor:pointer}
.switch input{appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:21px}
.estimate small{color:var(--muted);font-size:.82rem;flex:1 1 220px}
.estrow{display:grid;grid-template-columns:minmax(0,1fr) 150px 150px;gap:10px;align-items:center;padding:12px 0}
.navbar{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
/* tally */
aside.tally{position:sticky;top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.tally h3{font-size:1rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;font-size:.75rem}
.seg button{border:0;background:none;padding:4px 9px}
.seg [aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.tl{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;font-size:.9rem}
.tl b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.tl.inc{grid-template-columns:minmax(0,1fr) auto;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}
.tl .est{font-size:.7rem;color:var(--muted);margin-left:4px}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.balance{margin-top:12px;padding:14px;border-radius:9px}
.balance .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.balance .big{font-family:var(--display);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums}
.balance.pos{background:var(--good-soft);color:var(--good)}
.balance.neg{background:var(--bad-soft);color:var(--bad)}
.balance.zero{background:var(--accent-soft);color:var(--accent)}
.stack{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex;margin-top:12px}
.stack i{display:block;height:100%}
/* results */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card .k{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.card .v{font-family:var(--display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.compare{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.compare-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px 4px}
.compare-h h3{font-size:1.15rem}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.compare p.s{color:var(--muted);font-size:.86rem;margin:0;padding:0 18px 12px}
.rule .bar{grid-column:1/-1;height:6px;background:var(--line);border-radius:3px;position:relative;margin-top:6px}
.rule .bar i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.rule .bar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.status{display:inline-block;align-self:start;justify-self:end;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-green{background:var(--good-soft);color:var(--good)}
.s-yellow{background:var(--warn-soft);color:var(--warn)}
.s-red{background:var(--bad-soft);color:var(--bad)}
.s-none{background:var(--bg);color:var(--muted)}
.sectitle{font-size:1.15rem;margin:24px 0 10px}
.split{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.legend{display:grid;gap:7px;font-size:.9rem}
.legend div{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:10px;align-items:center}
.legend .pct{color:var(--muted);font-family:var(--mono);font-size:.8rem;width:3.4em;text-align:right}
.legend b{font-family:var(--mono);font-weight:500}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 18px;border-top:1px solid var(--line)}
.rule .nm{font-weight:700;font-size:.93rem}
.rule .nm span{font-family:var(--mono);font-weight:500;font-size:.82rem;color:var(--muted);margin-left:6px}
.rule .msg{grid-column:1/-1;color:var(--muted);font-size:.84rem}
.tips{display:grid;gap:10px}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.84rem;max-width:72ch;display:grid;gap:6px}
.foot h2{font-size:.95rem;color:var(--ink);margin:0 0 2px}
.foot p{margin:0}
.foot a{color:var(--accent)}
.notice{margin:0 0 16px}
.notice-in{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:12px 14px}
.notice-dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none}
.notice-t{flex:1 1 260px;min-width:0;display:grid;gap:2px;font-size:.9rem}
.notice-t span{color:var(--ink);opacity:.85}
.notice-a{display:flex;gap:6px;flex-wrap:wrap}
.notice-a .btn{padding:8px 14px}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(10,20,22,.45);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg-card{background:var(--surface);color:var(--ink);border-radius:14px;padding:22px;max-width:440px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.dlg-card h3{font-size:1.25rem;margin-bottom:8px}
.dlg-card p{color:var(--muted);margin:0 0 18px}
.dlg-a{display:flex;flex-direction:column;gap:8px}
.dlg-a .btn{width:100%}
.tfile{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:.82rem}
.tfile div{display:flex;flex-wrap:wrap;gap:4px 14px}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--accent);font-weight:700;font-size:.85rem;text-decoration:underline;text-underline-offset:3px}
.filebox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:22px 0 12px;min-width:0}
.filebox p.s{color:var(--muted);font-size:.88rem;margin:-4px 0 14px;max-width:62ch}
.fileacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fileact{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;color:var(--ink)}
.fileact:hover{border-color:var(--accent)}
label.btn,label.fileact{cursor:pointer;display:inline-flex;align-items:center}
label.fileact{display:flex;align-items:flex-start}
.fileact svg{flex:none;color:var(--accent);margin-top:1px}
.fileact b{display:block;font-size:.95rem}
.fileact small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35;margin-top:2px}
.flow,.topx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.flow-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.flow-h h3{font-size:1.1rem}
.flowbar{position:relative;display:flex;height:34px;margin-top:22px;border-radius:8px;overflow:visible;background:var(--line);margin-bottom:14px}
.flowbar i{display:block;height:100%}
.flowbar i:first-child{border-radius:8px 0 0 8px}
.flowbar i:last-child{border-radius:0 8px 8px 0}
.flowbar .incline{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--bad)}
.flowbar .over{position:absolute;top:0;bottom:0;border-radius:0 8px 8px 0;background:repeating-linear-gradient(135deg,var(--bad) 0 6px,var(--bad-soft) 6px 11px)}
.flowbar .incline span{position:absolute;top:-20px;right:5px;font-size:.72rem;font-style:normal;color:var(--bad);font-weight:700;white-space:nowrap}
.flowkey{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.flowkey div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:.9rem}
.flowkey b{font-family:var(--display);font-size:1.25rem;grid-column:2/-1}
.flowkey small{grid-column:2/-1;color:var(--muted);font-size:.78rem;margin-top:-2px}
.flowkey .short b{color:var(--bad)}
.topx p.s{color:var(--muted);font-size:.86rem;margin:-6px 0 12px}
.hb{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin-bottom:12px;min-width:0}
.flow,.topx,.compare,.split{min-width:0}
.hb:last-child{margin-bottom:0}
.hb-l{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.hb-l span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-l b{font-family:var(--mono);font-weight:500;white-space:nowrap}
.hb-t{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:5px}
.hb small{color:var(--muted);font-size:.76rem}
.tip{padding:13px 16px;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 var(--r) var(--r) 0}
.tip h4{margin:0 0 4px;font-size:.98rem}
.tip p{margin:0;color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:50}
.mobilebar{display:none}
/* Tablet portrait and below: one column, tally docks to the bottom */
@media (max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr)}
  aside.tally{display:none}
  .mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));justify-content:space-between;gap:12px;align-items:center}
  .mobilebar .mm{display:flex;gap:16px;font-size:.74rem;color:var(--muted)}
  .mobilebar .mm b{display:block;font-family:var(--mono);font-size:.95rem;color:var(--ink);font-weight:500}
  .mobilebar .btn{min-height:44px;min-width:56px}
  /* progress: bars only, but each step is a full-size tap target */
  .progress{gap:4px;margin:0 0 18px}
  .progress button{font-size:0;color:transparent;padding-block:16px;margin-block:-12px}
  /* 16px fields stop iOS zooming in on focus */
  .money input,.txt,select,.search input{font-size:16px}
  .btn{min-height:44px}
  .split{grid-template-columns:minmax(0,1fr)}
  .split svg{max-width:200px;margin:0 auto}
  h2{font-size:1.6rem}
}
/* Phones */
@media (max-width:600px){
  .row{grid-template-columns:minmax(0,.8fr) minmax(0,1.25fr) 40px 40px;gap:6px}
  .row .lab{grid-column:1/3;grid-row:1}
  .row>:nth-child(4){grid-column:3;grid-row:1;align-self:start}
  .row>:nth-child(5){grid-column:4;grid-row:1;align-self:start}
  .row>.money{grid-column:1;grid-row:2}
  .row>select{grid-column:2/-1;grid-row:2}
  .estrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .estrow>label{grid-column:1/-1}
  .cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .card{padding:10px 12px}
  .card .k{font-size:.64rem;letter-spacing:.04em}
  .card .v{font-size:1.05rem}
  h2{font-size:1.45rem}
  header.top .sub{display:none}
  .headr{display:contents}
  .brand{order:1;flex:1 1 0;min-width:0}
  .brand h1{font-size:1.15rem}
  .langbtn{order:2;min-height:40px;padding-inline:12px}
  .example{order:3;flex-basis:100%}
  .panel{padding-inline:14px}
  .navbar .btn{flex:1 1 auto}
  .yt,.compare-h h3{font-size:1.05rem}
  .flowkey{gap:6px}
  .flowkey div{font-size:.8rem;gap:2px 6px}
  .flowkey b{font-size:1rem}
  .flow,.topx{padding:14px}
  .fileacts{grid-template-columns:minmax(0,1fr)}
  .filebox{padding:14px}
}

function ruleText(c,r){
  const fr=isFr(),edge=pct(greenEdge(c)*100),zeroRed=r.max===0&&r.lv==="red";
  if(c==="savings"){
    if(r.p===0)return fr?`Vous ne mettez rien de côté pour l’instant. La cible habituelle est d’au moins ${edge} du revenu.`:`You're not setting anything aside yet. The usual target is at least ${edge} of income.`;
    return r.lv==="green"
      ?(fr?`Vous atteignez la cible habituelle d’au moins ${edge} du revenu.`:`You meet the usual target of at least ${edge} of income.`)
      :(fr?`Un peu sous la cible habituelle d’au moins ${edge} du revenu.`:`A little under the usual target of at least ${edge} of income.`);
  }
  if(zeroRed)return fr?`Vous n’avez rien prévu ici. La plupart des ménages y consacrent un montant, jusqu’à environ ${edge} du revenu.`:`You haven't planned anything here. Most households spend something, up to about ${edge} of income.`;
  if(r.lv==="green")return fr?`Dans la fourchette habituelle, soit jusqu’à ${edge} du revenu.`:`Within the usual range of up to ${edge} of income.`;
  if(r.lv==="yellow")return fr?`Un peu au-dessus de la fourchette habituelle, qui va jusqu’à ${edge} du revenu.`:`A bit above the usual range of up to ${edge} of income.`;
  return fr?`Nettement au-dessus de la fourchette habituelle, qui va jusqu’à ${edge} du revenu.`:`Well above the usual range of up to ${edge} of income.`;
}

function totals(){
  const inc=picked("income").reduce((s,id)=>s+mo(S.v[id]),0);
  const b={},cat={};
  OUT.forEach(k=>{
    if(estOn(k)){b[k]=mo(S.est[k]);return}
    b[k]=0;picked(k).forEach(id=>{const v=mo(S.v[id]);b[k]+=v;
      const c=ITEM[id]?ITEM[id].c:(k==="savings"?"savings":k==="debt"?"debt":null);if(c)cat[c]=(cat[c]||0)+v;});
  });
  const sav=b.savings,debt=b.debt;
  const out=OUT.reduce((s,k)=>s+b[k],0);
  return {inc,b,cat,debt,sav,out,bal:inc-out};
}

function chips(b){

/* ---------- results ---------- */
function rule(cat,amt,inc){
  const rs=D.rules.filter(r=>r.c===cat);if(!rs.length||!inc)return null;const p=amt/inc;
  if(p===0){const z=rs.find(r=>r.max===0&&r.lv==="red");return z?{...z,p}:null}
  const r=rs.find(r=>r.max>0&&p>r.min&&p<=r.max);return r?{...r,p}:null;
}
const greenEdge=c=>{const g=D.rules.find(r=>r.c===c&&r.lv==="green");return g?(g.max>=9999?g.min:g.max):0};
function donut(parts,total){
  const R=80,r=52,cx=105,cy=105;let a0=-Math.PI/2,p="";
  if(!total)return `<svg viewBox="0 0 210 210" role="img" aria-label="${L().nothingPlanned}"><circle cx="105" cy="105" r="66" fill="none" stroke="var(--line)" stroke-width="28"/></svg>`;
  parts.forEach(([l,v,c])=>{const a1=a0+v/total*Math.PI*2-0.0001,lg=a1-a0>Math.PI?1:0,pt=(a,rd)=>[cx+rd*Math.cos(a),cy+rd*Math.sin(a)];
    const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r),[x3,y3]=pt(a0,r);
    p+=`<path d="M${x0} ${y0}A${R} ${R} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${lg} 0 ${x3} ${y3}Z" fill="var(${c})" stroke="var(--surface)" stroke-width="2"><title>${esc(l)}</title></path>`;a0=a1+0.0001});
  return `<svg viewBox="0 0 210 210" role="img" aria-label="${L().whereMoney}">${p}<text x="105" y="100" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--body)">${L().planned}${per()}</text><text x="105" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)" font-family="var(--display)">${fmt(total*mult())}</text></svg>`;
}
function flowBar(t){
  const m=mult(),inc=t.inc,spend=t.out-t.sav,base=Math.max(inc,t.out)||1,w=v=>Math.max(v/base*100,0);
  if(!inc&&!t.out)return "";
  const segs=[[L().savingsL,t.sav,"--b-save"],[L().spending,spend,"--accent"]];
  if(t.bal>0)segs.push([L().leftOver,t.bal,"--good-mid"]);
  return `<section class="flow" aria-label="${L().whereIncome}"><div class="flow-h"><h3>${L().whereIncome}</h3><span class="sub">${L().income} ${fmt(inc*m)}${per()}</span></div>
   <div class="flowbar">${segs.filter(s=>s[1]>0).map(([l,v,c])=>`<i style="width:${w(v)}%;background:var(${c})" title="${esc(l)}: ${fmt(v*m)}"></i>`).join("")}${t.bal<0&&inc?`<b class="over" style="left:${w(inc)}%;width:${w(-t.bal)}%"></b><em class="incline" style="left:${w(inc)}%"><span>${L().income}</span></em>`:""}</div>
   <div class="flowkey">${segs.map(([l,v,c])=>`<div><span class="dot" style="background:var(${c})"></span><span>${l}</span><b>${fmt(v*m)}</b><small>${inc?pct(v/inc*100):""}</small></div>`).join("")}${t.bal<0?`<div class="short"><span class="dot" style="background:var(--bad)"></span><span>${L().shortfall}</span><b>${fmt(-t.bal*m)}</b><small>${inc?pct(-t.bal/inc*100):""}</small></div>`:""}</div></section>`;
}
function topExpenses(t){
  const m=mult(),inc=t.inc,list=[];
  OUT.filter(k=>k!=="savings").forEach(k=>{
    if(estOn(k)){const v=mo(S.est[k]);if(v>0)list.push({l:L().roughTotal(bT(k)),v,c:BUCKETS[k].color});return}
    picked(k).forEach(id=>{const v=mo(S.v[id]);if(v>0)list.push({l:label(id),v,c:BUCKETS[k].color})});
  });
  if(!list.length)return "";
  list.sort((a,b)=>b.v-a.v);const top=list.slice(0,5),max=top[0].v,spend=list.reduce((s,x)=>s+x.v,0),share=top.reduce((s,x)=>s+x.v,0)/spend*100;
  return `<section class="topx"><div class="flow-h"><h3>${L().biggest}</h3><span class="sub">${L().nOfM(top.length,list.length)}</span></div>
   <p class="s">${top.length<list.length?L().topShare(top.length,pct(share)):L().largest}</p>
   ${top.map(x=>`<div class="hb"><div class="hb-l"><span>${esc(x.l)}</span><b>${fmt(x.v*m)}${per()}</b></div><div class="hb-t"><i style="width:${x.v/max*100}%;background:var(${x.c})"></i></div>${inc?`<small>${L().ofIncome(pct(x.v/inc*100,1))}</small>`:""}</div>`).join("")}</section>`;
}
function results(){
  const t=totals(),m=mult(),inc=t.inc,Lx=L();
  const pc=v=>inc?v/inc*100:0;
  const parts=[[bT("home"),t.b.home,"--b-home"],[bT("around"),t.b.around,"--b-around"],[bT("everyday"),t.b.everyday,"--b-everyday"],[bT("family"),t.b.family,"--b-family"],[bT("debt"),t.debt,"--b-debt"],[bT("savings"),t.sav,"--b-save"]].filter(x=>x[1]>0);

  <section class="compare"><div class="compare-h"><h3>${Lx.howCompares}</h3>${checks.length?`<div class="counts">${["red","yellow","green"].map(l=>{const n=checks.filter(x=>x.r.lv===l).length;return n?`<span class="status s-${l}">${n} ${Lx.lv[l].toLowerCase()}</span>`:""}).join("")}</div>`:""}</div>
   <p class="s">${Lx.compareExpl}</p>
   ${checks.length?checks.map(x=>{const gm=greenEdge(x.c),sc=Math.max(.3,x.r.p*1.15,gm*2);return `<div class="rule"><span class="nm">${esc(x.l)}<span>${pct(x.r.p*100,1)} · ${fmt(x.v*m)}</span></span><span class="status s-${x.r.lv}">${Lx.lv[x.r.lv]}</span><span class="msg">${esc(ruleText(x.c,x.r))}</span><div class="bar" aria-hidden="true"><i style="width:${Math.min(x.r.p/sc,1)*100}%;background:var(--${x.r.lv==="green"?"good":x.r.lv==="yellow"?"warn":"bad"})"></i><em style="left:${gm/sc*100}%"></em></div></div>`}).join(""):`<div class="rule"><span class="msg">${inc?Lx.itemizeOne:Lx.addIncomeCompare}</span></div>`}
   ${rough.length?`<div class="rule"><span class="msg">${Lx.notCompared(rough.map(k=>bT(k)).join(", "))}</span></div>`:""}
  </section>
  <section class="filebox"><div class="flow-h"><h3>${Lx.fileTitle}</h3><span class="sub">${backupAge()}</span></div><p class="s">${Lx.fileExpl}</p>

    <button class="fileact" data-act="backup">${ICON_DL}<span><b>${Lx.saveBackup}</b><small>${Lx.saveBackupSub}</small></span></button>
    <label class="fileact" for="fileIn" role="button" tabindex="0">${ICON_UP}<span><b>${Lx.openBackup}</b><small>${Lx.openBackupSub}</small></span></label>
    <button class="fileact" data-act="csv">${ICON_SHEET}<span><b>${Lx.exportCsv}</b><small>${Lx.exportCsvSub}</small></span></button>
   </div></section>
  <div class="navbar"><button class="btn" data-go="${STEPS.length-2}">${Lx.edit}</button><button class="btn primary" data-act="copy">${Lx.copy}</button></div>`;
}

const ICON_DL=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>`;
const ICON_UP=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"/></svg>`;

/* ---------- files: backup (.json) and spreadsheet (.csv) ---------- */
const APP_ID="super-simple-budget",FILE_VERSION=1;
function backupAge(){
  if(!S.lastBackup)return L().noBackup;
  const d=Math.floor((Date.now()-S.lastBackup)/864e5);
  return L().lastBackup(d<=0?L().today:d===1?L().yesterday:L().daysAgo(d));
}
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
let dlCapP=null;const getDl=()=>dlCapP||(dlCapP=(window.claude&&window.claude.use)?window.claude.use("downloads").catch(()=>null):Promise.resolve(null));
async function offerFile(filename,data,mime){
  const dlCap=await getDl();
  if(dlCap){
    try{await dlCap.save({filename,data});return true}
    catch(err){toast(err&&err.code==="declined"?L().declined:L().dlUnavailable);return false}
  }
  // ordinary browsers (the Next.js app): a normal download
  try{const url=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return true}
  catch(e){toast(L().dlUnavailable);return false}
}
async function saveBackup(){
  const data={app:APP_ID,version:FILE_VERSION,savedAt:new Date().toISOString(),lang:S.lang,view:S.view,picked:S.picked,v:S.v,est:S.est,custom:S.custom};
  if(await offerFile(`${L().fileBase}-${today()}.json`,JSON.stringify(data,null,2),"application/json")){S.lastBackup=Date.now();S.changedAt=null;save();renderTally();renderNotice();if(STEPS[S.step]==="results")renderMain();toast(L().backupSaved);return true}
  return false;
}
function cleanBackup(o){
  if(!o||o.app!==APP_ID||typeof o.version!=="number"||o.version>FILE_VERSION)return null;
  const str=(s,n=80)=>typeof s==="string"?s.slice(0,n):"";
  const num=a=>a===""||a==null?"":(isFinite(+a)&&+a>=0&&+a<1e9?+a:"");
  const fq=f=>FREQ_M[f]?f:"Monthly";
  const custom={},picked={},v={},est={};
  Object.keys(BUCKETS).forEach(b=>{
    custom[b]=Array.isArray(o.custom&&o.custom[b])?o.custom[b].filter(c=>c&&/^c[a-z0-9]{1,16}$/.test(c.id)).slice(0,50).map(c=>({id:c.id,l:str(c.l)})):[];
    picked[b]=Array.isArray(o.picked&&o.picked[b])?[...new Set(o.picked[b].filter(id=>BUCKETS[b].ids.includes(id)))]:[];
    const e=o.est&&o.est[b];if(BUCKETS[b].est&&e)est[b]={on:!!e.on,a:num(e.a),f:fq(e.f)};
  });
  const ids=new Set([...Object.values(picked).flat(),...Object.values(custom).flat().map(c=>c.id)]);
  ids.forEach(id=>{const e=o.v&&o.v[id];v[id]={a:num(e&&e.a),f:fq(e&&e.f)}});
  return {picked,v,est,custom,view:o.view==="year"?"year":"month",lang:o.lang==="fr"?"fr":o.lang==="en"?"en":S.lang};
}
function readBackup(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{let c=null;try{c=cleanBackup(JSON.parse(r.result))}catch(e){}
    if(!c){toast(L().badFile);return}
    S={step:STEPS.length-1,isExample:false,more:{},lastBackup:S.lastBackup,changedAt:null,...c};render();save();window.scrollTo({top:0});toast(L().opened)};
  r.onerror=()=>toast(L().badFile);
  r.readAsText(file);
}
function csvCell(x,sep){
  let s=String(x??"");
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;            // stop spreadsheets reading text as a formula
  return (s.includes(sep)||/["\n\r]/.test(s))?'"'+s.replace(/"/g,'""')+'"':s;
}
async function exportCsv(){
  const Lx=L(),t=totals(),n=v=>v.toFixed(2).replace(".",Lx.dec);
  const rows=[Lx.csvHead];
  const add=(sec,name,e)=>rows.push([sec,name,n(+e.a||0),Lx.freq[e.f]||e.f,n(mo(e)),n(mo(e)*12)]);
  ["income",...OUT].forEach(k=>{
    if(k!=="income"&&estOn(k)){add(bT(k),Lx.roughTotal(bT(k)),S.est[k]);return}
    picked(k).forEach(id=>{const e=S.v[id];if(e&&+e.a>0)add(bT(k),label(id),e)});
  });
  rows.push([]);
  rows.push(["",Lx.totalIncome,"","",n(t.inc),n(t.inc*12)]);
  rows.push(["",Lx.totalPlanned,"","",n(t.out),n(t.out*12)]);
  rows.push(["",t.bal>=0?Lx.leftOver:Lx.shortfall,"","",n(Math.abs(t.bal)),n(Math.abs(t.bal)*12)]);
  const text="\ufeff"+rows.map(r=>r.map(c=>csvCell(c,Lx.sep)).join(Lx.sep)).join("\r\n")+"\r\n";
  if(await offerFile(`${Lx.fileBase}-${today()}.csv`,text,"text/csv"))toast(Lx.csvSaved);
}

function touched(){if(S.isExample){S.isExample=false;renderState()}if(!S.changedAt){S.changedAt=Date.now();S.snooze=null}save();renderNotice()}

document.addEventListener("click",async e=>{

    if(act==="cancel"){closeDlg();return}
    if(act==="go"){closeDlg();runAction(k);return}
    if(act==="save"){if(await saveBackup()){const d=$("#dlg");d.querySelector("#dlgB").textContent=L().dlgDone;
        d.querySelector(".dlg-a").innerHTML=`<button class="btn primary" data-dlg="go">${k==="open"?L().actOpen:k==="fresh"?L().actClear:L().actExample}</button><button class="btn ghost" data-dlg="cancel">${L().cancel}</button>`;d.querySelector("button").focus()}
      return}}
  if(e.target.closest("#dlg")&&e.target.id==="dlg"){closeDlg();return}
  const ol=e.target.closest('label[for="fileIn"]');
  if(ol&&unsaved()){e.preventDefault();askFirst("open");return}
  if(e.target.closest("#langBtn")){S.lang=isFr()?"en":"fr";render();save();return}
  const go=e.target.closest("[data-go]");if(go){S.step=Math.max(0,Math.min(STEPS.length-1,+go.dataset.go));S.q="";render();save();window.scrollTo({top:0,behavior:"smooth"});return}
  const v=e.target.closest("[data-view]");if(v){S.view=v.dataset.view;renderTally();renderMain();save();return}
  const pk=e.target.closest("[data-pick]");if(pk){const id=pk.dataset.pick,b=pk.dataset.b;(S.picked[b]||=[]).includes(id)||S.picked[b].push(id);S.v[id]||={a:"",f:ITEM[id].p||"Monthly"};
    if(b!==STEPS[S.step]){toast(L().addedTo(bT(b)));touched();renderTally();renderSearch();return}
    S.q="";renderMain();renderTally();document.getElementById("a-"+id)?.focus();touched();return}
  const up=e.target.closest("[data-unpick]");if(up){const id=up.dataset.unpick,b=up.dataset.b;S.picked[b]=(S.picked[b]||[]).filter(x=>x!==id);S.custom[b]=(S.custom[b]||[]).filter(c=>c.id!==id);renderMain();renderTally();touched();return}
  const mr=e.target.closest("[data-more]");if(mr){S.more[mr.dataset.more]=!S.more[mr.dataset.more];renderMain();save();return}
  const cu=e.target.closest("[data-custom]");if(cu){const b=cu.dataset.custom,id="c"+Date.now().toString(36);(S.custom[b]||=[]).push({id,l:""});S.v[id]={a:"",f:"Monthly"};renderMain();document.getElementById("l-"+id)?.focus();touched();return}
  const tp=e.target.closest("[data-tip]");if(tp){const el=document.getElementById("t-"+tp.dataset.tip);el.hidden=!el.hidden;tp.setAttribute("aria-expanded",String(!el.hidden));return}
  const a=e.target.closest("[data-act]");if(!a)return;
  if(a.dataset.act==="fresh"){askFirst("fresh");return}
  if(a.dataset.act==="example"){askFirst("example");return}
  if(a.dataset.act==="snooze"){S.snooze=Date.now()+60*60*1000;save();renderNotice();return}
  if(a.dataset.act==="backup"){saveBackup();return}
  if(a.dataset.act==="csv"){exportCsv();return}
  if(a.dataset.act==="copy"){const t=totals(),Lx=L();const txt=`${Lx.copyHead}\n${Lx.income}${isFr()?NB:""}: ${fmt(t.inc,2)}\n`+OUT.map(k=>`${bT(k)}${isFr()?NB:""}: ${fmt(t.b[k],2)}${estOn(k)?Lx.roughSuffix:""}`).join("\n")+`\n${t.bal>=0?Lx.leftOver:Lx.shortfall}${isFr()?NB:""}: ${fmt(t.bal,2)}`;
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast(Lx.copied),()=>toast(Lx.noCopy));else toast(Lx.noCopy)}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="fileIn"){readBackup(el.files&&el.files[0]);el.value="";return}
  if(el.dataset.est){const b=el.dataset.est;S.est[b]={...(S.est[b]||{a:"",f:"Monthly"}),on:el.checked};renderMain();renderTally();touched();return}
  if(el.dataset.estf){S.est[el.dataset.estf].f=el.value;renderTally();touched();return}
  if(el.dataset.k==="f"){(S.v[el.dataset.id]||={a:"",f:"Monthly"}).f=el.value;renderTally();touched()}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="q"){S.q=el.value;renderSearch();return}
  if(el.dataset.lab){const c=(S.custom[el.dataset.b]||[]).find(c=>c.id===el.dataset.lab);if(c)c.l=el.value;touched();return}
  const num=el.dataset.k==="a"||el.dataset.esta;if(!num)return;
  // accept "1 234,50" (French) and "1,234.50" (English)
  let raw=el.value;
  if(isFr())raw=raw.replace(/[\s  ]/g,"").replace(",",".");else raw=raw.replace(/,/g,"");
  const clean=raw.replace(/[^0-9.]/g,"");
  if(el.dataset.esta){S.est[el.dataset.esta].a=clean===""?"":+clean}
  else{(S.v[el.dataset.id]||={a:"",f:"Monthly"}).a=clean===""?"":+clean}
  renderTally();touched();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#dlg").hidden){closeDlg();return}const l=e.target.closest&&e.target.closest('label[for="fileIn"]');if(l&&(e.key==="Enter"||e.key===" ")){e.preventDefault();askFirst("open")}});
window.addEventListener("beforeunload",e=>{if(unsaved()){e.preventDefault();e.returnValue=""}});
render();
</script>

</body></html>
